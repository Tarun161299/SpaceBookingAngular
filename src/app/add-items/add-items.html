<div class="container">
    <div class="card">
      <h2><i class="fas fa-utensils"></i> Add New Menu Item</h2>
      <p class="subtitle">Fill in the details below to save a new dish to the menu</p>
  
      <form [formGroup]="foodForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label>Description</label>
          <input type="text" formControlName="foodDescription" placeholder="e.g. Paneer Butter Masala" />
        </div>
  
        <div class="form-row">
          <div class="form-group half">
            <label>Quantity</label>
            <input type="number" formControlName="quantity" placeholder="1" />
          </div>
          <div class="form-group half">
            <label>Rate (₹)</label>
            <input type="text" formControlName="rate" placeholder="250" />
          </div>
        </div>
  
        <div class="form-group">
          <label>Category</label>
          <select formControlName="category">
            <option value="">-- Select Category --</option>
            <option value="3">🥗 Beverages</option>
            <option value="2">🍛 Main Course</option>
            <option value="1">🍨 Dessert</option>
            
          </select>
        </div>
  
        <div class="form-group">
          <label>Upload Image</label>
          <input type="file" formControlName="file" (change)="onFileChange($event)" />
        </div>
  
        <button type="submit"   [disabled]="foodForm.invalid">Save Dish</button>
      </form>
    </div>
  </div>
